databases:
  - name: chat-db
    plan: free
    databaseName: chatapp
    user: chatapp

services:
  - type: web
    name: socket-chat-render
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
    disk:
      name: chat-data
      mountPath: /var/data
      sizeGB: 1
