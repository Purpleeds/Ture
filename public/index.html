async function deleteChannel(server, channel){
  if(!confirm('Delete #' + channel.name + '? Messages stay in the database but the channel disappears.')) return;
  try{
    const response = await fetch('/servers/' + server.id + '/channels/' + channel.id + '/delete', { method:'POST', headers:authHeaders(), body:'{}' });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'could not delete channel');
    await loadServers();
    renderSidebar();
    if(currentRoom === channel.room) switchServer(server.id);
    toast('Channel deleted');
  }catch(err){ toast(err.message); }
}

function openServerSettings(serverId){
  const server = serverById(serverId) || currentServer();
  if(!server) return;
  const channelRows = (server.channels || []).map(c =>
    '<div class="channelManageRow"><span># ' + escapeHtml(c.name) + '</span>' +
    (server.canManage ? '<button class="btn danger" data-del="' + c.id + '">Delete</button>' : '') + '</div>'
  ).join('');

  openModal(
    '<div class="modalHead"><h2>' + escapeHtml(server.name) + '</h2><p>Server settings</p></div>' +
    '<div class="modalBody">' +
      '<div class="rowFlex" style="margin-bottom:18px"><div id="serverSettingsIcon"></div>' +
      '<button class="btn grey" id="changeIconBtn">Change Icon</button></div>' +
      '<div class="settingsRow"><label class="formLabel">Server name</label>' +
      '<input class="formInput" id="serverNameInput" value="' + escapeHtml(server.name) + '" maxlength="60"></div>' +
      '<div class="settingsRow"><label class="formLabel">Invite code</label>' +
      '<div class="rowFlex"><div class="codeBox">' + escapeHtml(server.inviteCode || '—') + '</div>' +
      '<button class="btn grey" id="copyInviteBtn">Copy</button></div>' +
      '<div class="modalNote">Share this code — friends join with the compass button on the left.</div></div>' +
      '<div class="settingsRow"><label class="formLabel">Channels</label>' + channelRows +
      (server.canManage ? '<button class="btn grey" id="addChannelBtn" style="margin-top:6px">Create channel</button>' : '') + '</div>' +
      '<div class="modalMsg" id="modalMsg"></div>' +
    '</div>' +
    '<div class="modalFoot">' +
      (!server.isDefault && server.isOwner ? '<button class="btn danger" id="deleteServerBtn">Delete Server</button>' : '') +
      '<button class="btn ghost" onclick="closeModal()">Close</button>' +
      (server.canManage ? '<button class="btn" id="saveServerBtn">Save</button>' : '') +
    '</div>', true
  );

  const icon = $('serverSettingsIcon');
  icon.innerHTML = server.iconUrl
    ? '<div class="avatar lg" style="border-radius:16px"><img src="' + server.iconUrl + '" alt="icon"></div>'
    : '<div class="avatar lg" style="border-radius:16px;background:#4e5058">' + escapeHtml(serverInitials(server.name)) + '</div>';

  let iconUrl = server.iconUrl || '';
  const changeBtn = $('changeIconBtn');
  if(changeBtn) changeBtn.onclick = () => {
    const picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = 'image/*';
    picker.onchange = async () => {
      const file = picker.files && picker.files[0];
      if(!file) return;
      modalMessage('Uploading…');
      try{
        iconUrl = await uploadImageForProfile(file);
        icon.innerHTML = '<div class="avatar lg" style="border-radius:16px"><img src="' + iconUrl + '" alt="icon"></div>';
        modalMessage('Icon ready — press Save.');
      }catch(err){ modalMessage(err.message, true); }
    };
    picker.click();
  };

  const copyBtn = $('copyInviteBtn');
  if(copyBtn) copyBtn.onclick = () => copyText(server.inviteCode || '');

  const addBtn = $('addChannelBtn');
  if(addBtn) addBtn.onclick = () => { closeModal(); switchServer(server.id); openCreateChannel(); };

  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      const channel = (server.channels || []).find(c => String(c.id) === btn.dataset.del);
      if(channel){ closeModal(); await deleteChannel(server, channel); }
    };
  });

  const saveBtn = $('saveServerBtn');
  if(saveBtn) saveBtn.onclick = async () => {
    try{
      const response = await fetch('/servers/' + server.id + '/update', {
        method:'POST', headers:authHeaders(),
        body:JSON.stringify({ name: $('serverNameInput').value.trim(), iconUrl })
      });
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || 'could not save');
      await loadServers();
      renderRail();
      renderSidebar();
      closeModal();
      toast('Server updated');
    }catch(err){ modalMessage(err.message, true); }
  };

  const deleteBtn = $('deleteServerBtn');
  if(deleteBtn) deleteBtn.onclick = () => { closeModal(); deleteServer(server); };
}

async function deleteServer(server){
  if(!confirm('Delete "' + server.name + '"? This removes its channels for everyone.')) return;
  try{
    const response = await fetch('/servers/' + server.id + '/delete', { method:'POST', headers:authHeaders(), body:'{}' });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'could not delete server');
    await loadServers();
    renderRail();
    const first = servers.find(s => s.isDefault) || servers[0];
    if(first) switchServer(first.id);
    toast('Server deleted');
  }catch(err){ toast(err.message); }
}

  if(!confirm('Leave "' + server.name + '"?')) return;

    const response = await fetch('/servers/' + server.id + '/leave', { method:'POST', headers:authHeaders(), body:'{}' });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'could not leave server');
    await loadServers();
    renderRail();
    const first = servers.find(s => s.isDefault) || servers[0];
    if(first) switchServer(first.id);
    toast('Left server');
  }catch(err){ toast(err.message); }
}

/* ============================ input wiring ============================ */
function autoResize(){
  const input = $('messageInput');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 220) + 'px';
}

const input = $('messageInput');
input.addEventListener('input', () => { autoResize(); sendTyping(); });
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  if(e.key === 'Escape'){ cancelReply(); }
});

$('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

document.addEventListener('paste', e => {
  if(!token || !currentRoom) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const files = [];
  for(const item of items){
    if(item.kind === 'file'){
      const file = item.getAsFile();
      if(file) files.push(file);
    }
  }
  if(files.length){ e.preventDefault(); addFiles(files); }
});

const chatArea = $('chat');
chatArea.addEventListener('dragenter', e => {
  if(!token || !currentRoom) return;
  e.preventDefault();
  dragDepth++;
  $('dropOverlay').style.display = 'flex';
});
chatArea.addEventListener('dragover', e => e.preventDefault());
chatArea.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if(!dragDepth) $('dropOverlay').style.display = 'none';
});
chatArea.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  $('dropOverlay').style.display = 'none';
  if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

document.addEventListener('click', () => { hideContextMenu(); hideEmojiPicker(); });
window.addEventListener('resize', () => { hideContextMenu(); hideEmojiPicker(); });
window.addEventListener('focus', () => { isFocused = true; stopTabAlert(); });
window.addEventListener('blur', () => { isFocused = false; });
window.addEventListener('beforeunload', stopTyping);

$('overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
$('lightbox').addEventListener('click', e => { if(e.target.id === 'lightbox') closeLightbox(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('lightbox').classList.contains('open')) closeLightbox();
    else if($('overlay').classList.contains('open')) closeModal();
  }
});

$('password').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); login(); } });
$('username').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('password').focus(); } });
</script>
